# Deployment Configuration
deploy:
  # EC2 Configuration
  ec2:
    host: ${{ secrets.EC2_HOST }}
    username: ubuntu
    key: ${{ secrets.EC2_SSH_KEY }}
    port: 22
    directory: /home/ubuntu/jobsupport

  # Application Configuration
  app:
    name: jobsupport
    port: 3001
    node_version: '18'
    pm2_config: ecosystem.config.js

  # Build Configuration
  build:
    commands:
      - npm ci
      - npm run build
      - mkdir -p deploy
      - cp -r dist package.json package-lock.json .env ecosystem.config.js deploy/
      - cd deploy && zip -r ../deploy.zip . && cd ..

  # Deploy Configuration
  deploy:
    commands:
      - cd ~/jobsupport
      - unzip -o deploy.zip
      - npm ci --production
      - pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js
      - pm2 save 