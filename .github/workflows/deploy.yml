name: Deploy to EC2

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Create deployment package
        run: |
          zip -r deploy.zip . -x "node_modules/*" ".git/*" "dist/*"

      - name: Test SSH Connection
        run: |
          echo "Testing SSH connection..."
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "SSH key permissions set to 600"
          
          echo "Testing connection to ${{ secrets.EC2_HOST }}..."
          ssh -o StrictHostKeyChecking=no -v ubuntu@${{ secrets.EC2_HOST }} 'echo "SSH Connection Successful"'

      - name: Deploy to EC2
        if: success()
        run: |
          echo "Deploying to EC2..."
          scp -o StrictHostKeyChecking=no -v deploy.zip ubuntu@${{ secrets.EC2_HOST }}:~/jobsupport/
          
          echo "Running deployment commands..."
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} '
            cd ~/jobsupport && \
            unzip -o deploy.zip && \
            npm ci --production && \
            pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js && \
            rm deploy.zip && \
            echo "Deployment completed successfully!"
          ' 