name: Deploy to EC2

# Deployment workflow with updated SSH key configuration
on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Create deployment package
        run: |
          zip -r deploy.zip . -x "node_modules/*" ".git/*" "dist/*"

      - name: Debug SSH Setup
        run: |
          echo "Setting up SSH..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          echo "Checking EC2_HOST value..."
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "Error: EC2_HOST is empty"
            exit 1
          fi
          echo "EC2_HOST is set and not empty"
          
          echo "Writing SSH key..."
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "Error: EC2_SSH_KEY is empty"
            exit 1
          fi
          
          # Ensure proper line endings and format
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          echo "SSH key file contents (first line only):"
          head -n 1 ~/.ssh/id_rsa
          
          echo "SSH key permissions:"
          ls -la ~/.ssh/id_rsa
          
          echo "SSH key format check:"
          ssh-keygen -l -f ~/.ssh/id_rsa || echo "Invalid key format"

      - name: Test SSH Connection
        run: |
          echo "Testing SSH connection..."
          HOST="${{ secrets.EC2_HOST }}"
          echo "Will connect to: $HOST"
          
          # Try to resolve the hostname
          echo "Attempting to resolve hostname..."
          getent hosts $HOST || echo "Failed to resolve hostname"
          
          echo "Attempting SSH connection..."
          ssh -o StrictHostKeyChecking=no -v ubuntu@$HOST 'echo "SSH Connection Successful"'

      - name: Deploy to EC2
        if: success()
        run: |
          HOST="${{ secrets.EC2_HOST }}"
          echo "Deploying to EC2 at $HOST..."
          scp -o StrictHostKeyChecking=no -v deploy.zip ubuntu@$HOST:~/jobsupport/
          
          echo "Running deployment commands..."
          ssh -o StrictHostKeyChecking=no ubuntu@$HOST '
            cd ~/jobsupport && \
            unzip -o deploy.zip && \
            npm ci --production && \
            pm2 restart ecosystem.config.js || pm2 start ecosystem.config.js && \
            rm deploy.zip && \
            echo "Deployment completed successfully!"
          ' 